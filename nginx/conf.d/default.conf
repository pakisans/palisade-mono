# ─────────────────────────────────────────────────────────────────────────────
# Palisada — reverse proxy (Docker Compose nginx kontejner)
#   palisada.rs, www.palisada.rs  → frontend    (upstream app2:3000)
#   admin.palisada.rs             → backend/CMS  (upstream app1:3000), root → /admin
#
# NAPOMENA: upstream-i su INTERNA Docker imena (app_network), NE localhost.
# TLS terminira nginx; ka app-ovima ide plain HTTP + X-Forwarded-* zaglavlja.
# ─────────────────────────────────────────────────────────────────────────────

# Cache zona — 512MB na disku, 20MB ključevi, čisti neaktivno posle 10 min
proxy_cache_path /var/cache/nginx
                 levels=1:2
                 keys_zone=app:20m
                 max_size=512m
                 inactive=10m
                 use_temp_path=off;

# WebSocket / Upgrade (Next.js HMR nije u produkciji, ali live-preview i sl. mogu)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ============================ HTTP :80 =======================================
# Certbot ACME izazov (webroot) + trajno preusmerenje na HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name palisada.rs www.palisada.rs admin.palisada.rs;

    # ACME izazov mora ostati na HTTP-u (Certbot webroot piše ovde)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ========================= FRONTEND :443 =====================================
# palisada.rs + www.palisada.rs → app2 (Next.js)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name palisada.rs www.palisada.rs;

    ssl_certificate     /etc/letsencrypt/live/palisada.rs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/palisada.rs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # (OPCIONO — preporuka za SEO) www → apex. Otkomentariši za kanonski host:
    # if ($host = www.palisada.rs) { return 301 https://palisada.rs$request_uri; }

    client_max_body_size 25m;
    proxy_connect_timeout 60s;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml font/woff2;

    # Next.js statika — dug keš (content-hash u imenu → immutable)
    location /_next/static/ {
        proxy_pass http://app2:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_cache app;
        proxy_cache_valid 200 365d;
        proxy_cache_use_stale error timeout updating;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache $upstream_cache_status;
    }

    # Sve stranice → Next.js (ISR keš je interni; nginx ne kešira HTML)
    location / {
        proxy_pass http://app2:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }
}

# ======================= BACKEND / ADMIN :443 ================================
# admin.palisada.rs → app1 (Payload CMS). Root "/" → /admin.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.palisada.rs;

    ssl_certificate     /etc/letsencrypt/live/admin.palisada.rs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.palisada.rs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # CMS upload-i (slike, PDF) — veći limit tela zahteva
    client_max_body_size 50m;
    proxy_connect_timeout 60s;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;

    # Root → /admin (samo tačan "/"; sve ostale rute netaknute)
    location = / {
        return 302 /admin;
    }

    # Payload media — keš 24h
    location /media/ {
        proxy_pass http://app1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_cache app;
        proxy_cache_valid 200 24h;
        proxy_cache_use_stale error timeout updating;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600";
        add_header X-Cache $upstream_cache_status;
        # Backend nikad ne indeksirati
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # admin, api, i sve ostalo → backend, bez keša
    location / {
        proxy_pass http://app1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        add_header Cache-Control "no-store";
        # Backend (CMS/admin/api) se NIKAD ne indeksira u pretraživačima
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
